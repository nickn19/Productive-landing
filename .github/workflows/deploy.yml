name: Deploy Website to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "========== DEBUG =========="
            whoami
            id
            pwd

            echo "========== SUDO =========="
            sudo -l

            echo "========== DIRECTORY =========="
            ls -ld /var/www/produc8ive-frontend

            echo "========== DEPLOY =========="
            cd /var/www/produc8ive-frontend
            bash deploy.sh
