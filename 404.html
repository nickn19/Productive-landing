<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages 404 redirect trick for SPA routing
      // If the path starts with /pages/, redirect to react-build with the path encoded
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      if (path.indexOf('/pages/') === 0 || path === '/pages') {
        // Store the intended path and redirect to react-build/index.html
        sessionStorage.setItem('spa-redirect', path + search + hash);
        window.location.replace(
          window.location.origin + '/react-build/index.html'
        );
      } else {
        // Not a React route, show a simple 404
        document.write('<h1>404 - Page not found</h1>');
      }
    </script>
  </head>
  <body></body>
</html>
